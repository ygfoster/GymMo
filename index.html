<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>GymMo は終了しました</title>
  <!-- GymMo（Gemini 版）は公開を終了し、GymMo2（https://gymmo2.gymmo2.workers.dev/）に移行した。元の画面は original-index.html に残している（動作はしない）。 -->
  <style>
    :root { color-scheme: light dark; --bg: light-dark(#f2f2f7, #000); --fg: light-dark(#000, #fff); --sub: light-dark(rgba(60,60,67,.62), rgba(235,235,245,.62)); }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
      font: 16px/1.6 -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { color: var(--sub); margin: 0 0 22px; }
    a.btn { display: inline-block; padding: 13px 26px; border-radius: 14px; background: var(--fg); color: var(--bg); text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>GymMo は終了しました</h1>
    <p>新しい GymMo2 へ移動しています…</p>
    <a class="btn" href="https://gymmo2.gymmo2.workers.dev/">GymMo2 を開く</a>
  </main>
  <script>
    try {
      if (navigator.serviceWorker) navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { if (r.scope.indexOf('/GymMo/') !== -1) r.unregister(); }); });
      if (window.caches) caches.keys().then(function (ks) { ks.forEach(function (k) { if (k.indexOf('gym-memo') === 0) caches.delete(k); }); });
    } catch (e) {}
    location.replace('https://gymmo2.gymmo2.workers.dev/');
  </script>
</body>
</html>
